const menu=[['inicio','⌂','Inicio'],['crear','✦','Crear instrumento'],['proyecto','▧','De mi proyecto a mi instrumento'],['biblioteca','▤','Biblioteca'],['mis','▣','Mis instrumentos'],['aplicar','☑','Aplicar evaluación'],['reportes','▥','Seguimiento'],['inclusion','♡','Evaluación inclusiva'],['acerca','ⓘ','Acerca de EVACLIC']];

const storageKey='evaclic_instrumentos_v1';const readDocs=()=>{try{return JSON.parse(localStorage.getItem(storageKey)||'[]')}catch{return[]}};function toast(s){document.querySelector('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.textContent=s;document.body.appendChild(e);setTimeout(()=>e.remove(),2800)};

function inicio(){return `<section class="hero"><div class="hero-copy"><div class="eyebrow">✦ BIENVENID@ A EVACLIC ✦</div><h2>¡Crea instrumentos de evaluación con un clic!</h2><p>Diseña, adapta y genera instrumentos de evaluación de forma fácil, práctica e inclusiva. ¡Tus ideas se convierten en herramientas!</p><button class="btn" onclick="newDoc()">✎ Crear instrumento ❯</button></div><img src="assets/avatar_mafer.png" alt="Avatar de Mafer con delantal escolar"></section><h3 class="section-title">¿Qué quieres hacer hoy?</h3><div class="cards home-cards">${tile('☑','Generador de instrumentos','Crea rúbricas, listas de cotejo, escalas y mucho más.','#ffd6ea','newDoc()')}${tile('⇧','De mi proyecto a mi instrumento','Sube tu planeación y recibe criterios editables.','#fff0bc',"navigate('proyecto')")}${tile('☆','Plantillas y ejemplos','Explora instrumentos para adaptar a tu contexto.','#e2ffc9',"navigate('biblioteca')")}${tile('▣','Mis instrumentos','Guarda, organiza y recupera tus evaluaciones.','#d7f0ff',"navigate('mis')")}</div><div class="home-bottom"><div><strong>🌈 ¡Evaluar también puede ser creativo!</strong><p>Sin cuentas y sin IA de pago. Recuerda revisar los instrumentos antes de aplicarlos.</p></div><button class="btn secondary" onclick="navigate('inclusion')">Conocer el enfoque inclusivo ❯</button></div>`}
function biblioteca(){let filt=state.category;return `<div class="panel"><h2>Biblioteca de instrumentos</h2><p class="muted">Elige un tipo de instrumento. Cada formato adapta automáticamente su estructura.</p><div class="category-tabs">${[['todos','Todos'],['aprendizaje','Aprendizaje'],['docente','Docentes'],['inclusion','Inclusión y USAER'],['institucional','Institucional']].map(([id,t])=>`<button class="${filt===id?'active':''}" onclick="state.category='${id}';render()">${t}</button>`).join('')}</div>${templates.filter(t=>filt==='todos'||t[1]===filt).map(([name,cat,desc])=>`<div class="instrument"><div><strong>${esc(name)}</strong><small>${esc(desc)}</small></div><button class="btn secondary" onclick="newDoc('${esc(name)}','${cat}')">Usar plantilla</button></div>`).join('')}</div>`}
function newDoc(type='Rúbrica analítica',mod='aprendizaje'){state.doc=JSON.parse(JSON.stringify(starter));state.doc.type=type;state.doc.module=mod;state.doc.title=type==='Rúbrica analítica'?'Trabajo colaborativo':type;state.doc.id=null;state.step=0;navigate('crear')}
function sync(){document.querySelectorAll('[data-field]').forEach(e=>{state.doc[e.dataset.field]=e.value});document.querySelectorAll('[data-criterion]').forEach(e=>state.doc.criteria[+e.dataset.criterion]=e.value);document.querySelectorAll('[data-level]').forEach(e=>state.doc.levels[+e.dataset.level]=e.value)}
const field=(label,key,type='text',options)=>`<div class="field"><label for="f-${key}">${label}</label>${options?`<select id="f-${key}" data-field="${key}" onchange="state.doc.${key}=this.value">${options.map(o=>`<option ${state.doc[key]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:type==='textarea'?`<textarea id="f-${key}" data-field="${key}">${esc(state.doc[key])}</textarea>`:`<input id="f-${key}" type="${type}" data-field="${key}" value="${esc(state.doc[key])}">`}</div>`;
function crear(){let s=state.step,d=state.doc;let heading=['¿Qué deseas evaluar?','Cuéntanos sobre el contexto','Selecciona el instrumento','Define indicadores y criterios','Personaliza tu documento','Revisa y descarga'];let body='';if(s===0)body=field('Título del instrumento','title')+field('Propósito de evaluación','purpose','textarea')+field('Módulo','module','text')+`<p class="smallmuted">Módulos sugeridos: aprendizaje, docente, inclusión e institucional.</p>`;
if(s===1)body=`<div class="grid2">${field('Nivel educativo','level','text')}${field('Grado o destinatarios','grade')}${field('Escuela','school')}${field('Grupo','group')}</div>`+field('Contexto relevante','context','textarea')+field('Apoyos, ajustes o accesibilidad','adjustments','textarea');
if(s===2)body=field('Tipo de instrumento','type','text')+`<div class="note">Los tipos disponibles se encuentran en la biblioteca. Puedes cambiar el formato aquí mediante el selector inferior.</div><div class="field"><label>Elegir formato</label><select onchange="state.doc.type=this.value;render()">${templates.map(t=>`<option ${d.type===t[0]?'selected':''}>${esc(t[0])}</option>`).join('')}</select></div>`;
if(s===3)body=`<p class="muted">Escribe indicadores positivos, claros y verificables. En las rúbricas, cada nivel puede describirse con mayor detalle en la vista previa.</p>${d.criteria.map((c,i)=>`<div class="criteria-row"><label>Indicador ${i+1}</label><div class="actions"><input style="flex:1;min-width:160px" data-criterion="${i}" value="${esc(c)}"><button class="btn danger" onclick="sync();removeCriterion(${i})" aria-label="Eliminar indicador">✕</button></div></div>`).join('')}<button class="btn soft" onclick="sync();state.doc.criteria.push('Nuevo indicador observable');render()">+ Añadir indicador</button>${/Rúbrica|Escala|Autoevaluación|Coevaluación/.test(d.type)?`<h3 class="section-title">Niveles o categorías de valoración</h3>${d.levels.map((l,i)=>`<div class="field"><label>Nivel ${i+1}</label><div class="actions"><input style="flex:1" data-level="${i}" value="${esc(l)}"><button class="btn danger" onclick="sync();state.doc.levels.splice(${i},1);render()">✕</button></div></div>`).join('')}<button class="btn soft" onclick="sync();state.doc.levels.push('Nuevo nivel');render()">+ Añadir nivel</button>`:''}`;
if(s===4)body=`<div class="grid2">${field('Docente o evaluador','teacher')}${field('Fecha','date','date')}${field('Nombre del estudiante / destinatario','student')}${field('Firma / responsable','signature')}</div>`+field('Instrucciones de aplicación','instructions','textarea')+field('Observaciones generales','notes','textarea');
if(s===5)body=`<div class="actions screen-controls"><button class="btn" onclick="saveDoc()">▣ Guardar instrumento</button><button class="btn secondary" onclick="printDoc()">⎙ Imprimir / PDF</button><button class="btn secondary" onclick="downloadWord()">↓ Descargar Word</button><button class="btn ghost" onclick="downloadJSON()">↓ Respaldo JSON</button></div><p class="smallmuted">El PDF se obtiene desde la opción «Guardar como PDF» del cuadro de impresión. Word se descarga como documento editable .doc.</p><div class="preview-shell"><div class="paper" id="paper">${paperHTML(d)}</div></div>`;
return `<div class="panel"><span class="pill">Paso ${s+1} de 6</span><h2 style="margin-top:10px">${heading[s]}</h2><div class="progress">${heading.map((_,i)=>`<i class="${i<=s?'on':''}"></i>`).join('')}</div><div class="stepnote">${['Define el propósito antes de elegir el formato.','Las características del contexto ayudan a tomar decisiones pedagógicas.','Usa un formato adecuado para la evidencia que deseas recoger.','Los indicadores deben describir acciones o evidencias, no etiquetas sobre personas.','Agrega datos institucionales y ajustes pertinentes.','Comprueba el contenido y guarda tu trabajo.'][s]}</div>${body}<div class="actions screen-controls" style="justify-content:space-between;margin-top:20px"><button class="btn secondary" onclick="sync();${s===0?"navigate('inicio')":'state.step--;render()'}">← ${s===0?'Volver':'Anterior'}</button>${s<5?`<button class="btn" onclick="sync();state.step++;render()">Siguiente →</button>`:`<button class="btn soft" onclick="state.step=3;render()">Editar indicadores</button>`}</div></div>`}
function removeCriterion(i){if(state.doc.criteria.length<=1){toast('Debe quedar al menos un indicador');return}state.doc.criteria.splice(i,1);render()}
function paperHTML(d){const types=d.type||'';const rub=/Rúbrica/.test(types),scale=/Escala|Autoevaluación|Coevaluación/.test(types),check=/Lista de cotejo/.test(types);const levels=rub||scale?(d.levels.length?d.levels:['Logrado','En proceso','Requiere apoyo']):check?['Sí','No']:['Evidencia / registro'];let cols='<tr><th style="width:30%">Indicador / criterio</th>'+levels.map(l=>`<th>${esc(l)}</th>`).join('')+'</tr>';let rows=d.criteria.map((c,i)=>`<tr><td>${esc(c)}</td>${levels.map((l,j)=>`<td>${rub?esc(`${l}: ${c.replace(/[.]+$/,'').toLowerCase()} ${j===0?'con autonomía y consistencia':j===levels.length-1?'con apoyo frecuente':'con apoyo ocasional'}.`):'□'}</td>`).join('')}</tr>`).join('');return `<h2>${esc(d.title)}</h2><p class="meta"><b>Instrumento:</b> ${esc(types)} &nbsp; <b>Propósito:</b> ${esc(d.purpose)}</p><p class="meta"><b>Escuela:</b> ${esc(d.school||'________________')} &nbsp; <b>Nivel/grado:</b> ${esc(d.level)} / ${esc(d.grade)} &nbsp; <b>Grupo:</b> ${esc(d.group||'_____')}</p><p class="meta"><b>Evaluador:</b> ${esc(d.teacher||'________________')} &nbsp; <b>Fecha:</b> ${esc(d.date)} &nbsp; <b>Destinatario:</b> ${esc(d.student||'________________')}</p><p class="meta"><b>Instrucciones:</b> ${esc(d.instructions)}</p><table><thead>${cols}</thead><tbody>${rows}</tbody></table><p class="meta"><b>Contexto:</b> ${esc(d.context||'No especificado')}</p><p class="meta"><b>Apoyos y ajustes:</b> ${esc(d.adjustments||'No especificados')}</p><p class="meta"><b>Observaciones:</b> ${esc(d.notes||'________________________________________________________________')}</p><p class="meta" style="margin-top:30px"><b>Firma:</b> __________________________________ ${esc(d.signature)}</p><p style="text-align:center;font-size:10px;color:#888;margin-top:30px">Instrumento generado con EVACLIC · Creado por Mafer</p>`}
function saveDoc(){sync();const list=readDocs();let d=structuredClone(state.doc);if(!d.id)d.id='e'+Date.now();d.updated=new Date().toISOString();let index=list.findIndex(x=>x.id===d.id);if(index<0)list.unshift(d);else list[index]=d;try{localStorage.setItem(storageKey,JSON.stringify(list));state.doc.id=d.id;toast('Instrumento guardado en este navegador')}catch(e){toast('No se pudo guardar: almacenamiento no disponible')}}
function printDoc(){sync();state.step=5;render();window.print()}
function downloadBlob(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function filename(){return (state.doc.title||'instrumento').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').slice(0,45)}
function downloadWord(){sync();let html=`<!doctype html><html><head><meta charset="utf-8"><style>body{font-family:Arial}table{border-collapse:collapse;width:100%}td,th{border:1px solid gray;padding:8px;font-size:11pt}h2{text-align:center}.local-notice{background:#eaf9ff;border:1px solid #cfeeff;padding:16px;border-radius:15px;margin:15px 0 20px}.local-notice p{margin:7px 0 0;font-size:13px;color:#5f6070}.privacy-link{color:#8b5be0;font-size:13px;font-weight:700}.about-avatar,.hero img,.avatar-chip img{background:transparent}.sidefoot img{object-fit:contain;padding:7px}  .ai-banner{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(120deg,var(--lav),var(--blue));border-radius:20px;padding:20px;gap:16px}.ai-banner img{max-width:130px;max-height:200px;object-fit:contain;align-self:end}.ai-banner p{max-width:490px;color:#625675}.ai-settings{margin-top:24px;border-top:1px solid #e9e4ef;padding-top:16px}.ai-settings summary{cursor:pointer;font-weight:600}.ai-settings input{width:100%} @media(max-width:650px){.ai-banner img{max-width:86px}} .project-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(120deg,var(--lav),var(--blue),var(--mint));padding:20px;border-radius:18px}.project-banner img{max-width:135px;max-height:170px;object-fit:contain}.project-banner p{color:#625675}.analysis-results{margin-top:24px;border:1px solid #d9eade;background:linear-gradient(120deg,#f9ffef,#f4fffb);border-radius:16px;padding:20px}.analysis-results input{width:100%}@media(max-width:600px){.project-banner img{max-width:75px}} .evaclic-logo{display:block;width:100%;height:auto;max-width:210px;object-fit:contain}.brand{padding:4px 0 16px;justify-content:center}.sidebar{min-width:0}@media (min-width:651px) and (max-width:990px){.evaclic-logo{width:66px;max-width:none;height:auto}.brand{overflow:hidden}}@media(max-width:650px){.evaclic-logo{width:72px;min-width:72px;height:auto}.brand{padding:0}}

function downloadJSON(){sync();downloadBlob(new Blob([JSON.stringify(state.doc,null,2)],{type:'application/json'}),filename()+'.json')}
function mis(){let list=readDocs();return `<div class="panel"><h2>Mis instrumentos <span class="pill">${list.length} guardado${list.length===1?"":"s"}</span></h2><div class="local-notice"><strong>🔒 Guardado local — no es una cuenta privada</strong><p>Los instrumentos se guardan en este navegador y perfil del dispositivo. No se suben a internet ni aparecen en los dispositivos de otros docentes. Sin embargo, cualquier persona que use este mismo perfil del navegador podría verlos o modificarlos. Si borras los datos del navegador, pueden perderse.</p><p><b>Consejo:</b> descarga una copia de seguridad y evita incluir datos personales sensibles del alumnado.</p></div>${list.length?list.map(d=>`<div class="instrument"><div><strong>${esc(d.title)}</strong><small>${esc(d.type)} · ${new Date(d.updated).toLocaleDateString('es-MX')}</small></div><div class="actions"><button class="btn soft" onclick="openSaved('${d.id}')">Editar</button><button class="btn danger" onclick="deleteSaved('${d.id}')">Eliminar</button></div></div>`).join(''):`<div class="empty">Todavía no tienes instrumentos guardados.</div>`}<div class="actions" style="margin-top:15px"><button class="btn" onclick="newDoc()">+ Crear instrumento</button><button class="btn soft" onclick="exportAllDocs()">↓ Respaldar todos (.json)</button><label class="btn secondary" style="cursor:pointer;margin:0">↑ Importar JSON<input type="file" accept=".json,application/json" style="display:none" onchange="importJSON(event)"></label></div></div>`}
function exportAllDocs(){const list=readDocs();if(!list.length){toast('Aún no hay instrumentos para respaldar');return}downloadBlob(new Blob([JSON.stringify({app:'EVACLIC',version:5,instruments:list},null,2)],{type:'application/json'}),'EVACLIC_respaldo_completo.json');toast('Respaldo completo descargado')}
function openSaved(id){let d=readDocs().find(x=>x.id===id);if(d){state.doc=structuredClone(d);state.step=5;navigate('crear')}}function deleteSaved(id){if(!confirm('¿Eliminar este instrumento guardado?'))return;localStorage.setItem(storageKey,JSON.stringify(readDocs().filter(x=>x.id!==id)));render();toast('Instrumento eliminado')}
function importJSON(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(d.app==='EVACLIC'&&Array.isArray(d.instruments)){const incoming=d.instruments.filter(x=>x&&typeof x.title==='string'&&Array.isArray(x.criteria));if(!incoming.length)throw Error();const list=readDocs();for(const item of incoming){list.unshift({...structuredClone(starter),...item,id:'e'+Date.now()+Math.random().toString(36).slice(2,8)});}localStorage.setItem(storageKey,JSON.stringify(list));toast(incoming.length+' instrumentos importados');navigate('mis');return;}if(!d.title||!Array.isArray(d.criteria))throw Error();state.doc={...structuredClone(starter),...d,id:null};saveDoc();navigate('mis')}catch{toast('Este archivo no tiene un formato compatible con EVACLIC')}};r.readAsText(f)}
function aplicar(){return `<div class="panel"><h2>Aplicar evaluación</h2><p class="muted">En esta versión, los instrumentos se imprimen o editan en Word para su aplicación. En una próxima fase se incorporará el registro digital de valoraciones y evidencias.</p><button class="btn" onclick="navigate('mis')">Ver mis instrumentos</button></div>`}
function reportes(){return `<div class="panel"><h2>Seguimiento y reportes</h2><p>Esta sección se habilitará cuando EVACLIC incorpore la captura de evaluaciones. Así se podrán comparar periodos usando criterios equivalentes.</p><div class="note">No se muestran datos de estudiantes ni gráficas simuladas como si fueran resultados reales.</div><button class="btn soft" style="margin-top:18px" onclick="navigate('mis')">Consultar instrumentos</button></div>`}
function inclusion(){return `<div class="panel"><h2>Evaluación inclusiva y USAER</h2><p class="muted">Una evaluación pertinente considera el contexto y las oportunidades de participación, además de los desempeños observables.</p><div class="grid2">${tile('♡','Identificación de BAP','Barreras presentes en entornos y prácticas','#dff3eb',"newDoc('Registro de BAP','inclusion')")}${tile('☑','Ajustes razonables','Apoyos implementados y su pertinencia','#e3f0fc',"newDoc('Seguimiento de ajustes razonables','inclusion')")}${tile('✦','Intervención USAER','Seguimiento de estrategias','#eee5fb',"newDoc('Evaluación de intervención USAER','inclusion')")}${tile('▤','Bitácora','Registro de acuerdos y acciones','#fce7ef',"newDoc('Bitácora de intervención','inclusion')")}</div><p class="note" style="margin-top:20px">Procura no incluir diagnósticos ni datos identificables de alumnas y alumnos cuando no sean indispensables. El instrumento generado es un borrador que requiere revisión pedagógica antes de su aplicación.</p></div>`}
function acerca(){return `<div class="panel"><div class="grid2" style="align-items:center"><div><span class="pill">Creado por Mafer</span><h2 style="font-size:32px;margin-top:15px">EVACLIC 💜</h2><h3>Instrumentos de evaluación al alcance de un clic</h3><p class="muted">Un proyecto digital para apoyar a docentes en el diseño de instrumentos claros, formativos, editables e inclusivos.</p><img class="logo-big" src="assets/logo_mafer.png" alt="Logo original completo de Mafer, sin recorte"><p class="smallmuted">Logo original utilizado con proporción completa.</p></div><div style="text-align:center;background:#dff8f4;border-radius:22px"><img class="about-avatar" src="assets/avatar_usaer.png" alt="Avatar de Mafer con camiseta USAER 103"></div></div></div>`}

const AI_PROXY_URL=localStorage.getItem('evaclic_ai_endpoint')||'';

const projectState={file:'',text:'',findings:[],format:'auto',module:'aprendizaje'};
function projectView(){return `<div class="panel"><div class="project-banner"><div><span class="pill">NUEVO · SIN IA · SIN CUENTAS</span><h2>De mi proyecto a mi instrumento</h2><p>Sube tu planeación o pega su contenido. EVACLIC reconocerá palabras y secciones habituales para sugerirte criterios editables.</p></div><img src="assets/avatar_asistente.png" alt="Avatar transparente de Mafer"></div>
<div class="local-notice"><strong>🔒 Tu documento se procesa en este navegador</strong><p>No lo subimos a un servidor ni lo guardamos automáticamente. Para leer PDF y Word puede ser necesario cargar bibliotecas de procesamiento desde internet. Evita documentos con nombres, diagnósticos u otros datos sensibles del alumnado.</p></div>
<div class="field"><label for="project-upload">Selecciona tu documento</label><input id="project-upload" type="file" accept=".txt,.docx,.pdf,text/plain,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" onchange="readProject(event)"><p class="smallmuted">Archivos TXT, DOCX o PDF con texto seleccionable (máximo 8 MB). No se admiten documentos .doc antiguos ni PDF escaneados.</p></div>
<div id="project-status" class="note">${esc(projectState.file?`Documento: ${projectState.file}`:'También puedes pegar el texto de tu proyecto directamente.')}</div>
<div class="field"><label for="project-text">Texto de la planeación o proyecto (puedes revisarlo y editarlo)</label><textarea id="project-text" rows="12" placeholder="Título del proyecto, propósito, contenidos, actividades, producto final y evidencias de aprendizaje…">${esc(projectState.text)}</textarea></div>
<div class="grid2"><div class="field"><label for="project-mode">Ámbito de evaluación</label><select id="project-mode"><option value="aprendizaje">Aprendizaje del alumnado</option><option value="docente">Práctica docente</option><option value="inclusion">Inclusión y USAER</option><option value="institucional">Proyecto institucional</option></select></div><div class="field"><label for="project-format">Tipo de instrumento</label><select id="project-format"><option value="auto">Recomiéndame uno</option>${templates.map(t=>`<option value="${esc(t[0])}">${esc(t[0])}</option>`).join('')}</select></div></div>
<button class="btn" onclick="analyzeProject()">▧ Analizar mi proyecto</button><div id="project-findings" aria-live="polite"></div></div>`}
function proyecto(){return projectView()}
async function loadScriptOnce(url,test){if(test())return;await new Promise((resolve,reject)=>{const el=document.createElement('script');el.src=url;el.onload=resolve;el.onerror=()=>reject(new Error('No se pudo cargar el lector. Comprueba tu conexión o pega el texto directamente.'));document.head.appendChild(el)})}
async function readProject(e){const file=e.target.files?.[0];if(!file)return;const status=$('#project-status');if(file.size>8*1024*1024){status.textContent='El archivo supera el límite de 8 MB.';return}status.textContent='Leyendo '+file.name+'…';try{let text='';let ext=file.name.toLowerCase().split('.').pop();if(ext==='txt'){text=await file.text()}else if(ext==='docx'){await loadScriptOnce('https://cdn.jsdelivr.net/npm/mammoth@1.9.0/mammoth.browser.min.js',()=>!!window.mammoth);let r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});text=r.value}else if(ext==='pdf'){await loadScriptOnce('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',()=>!!window.pdfjsLib);pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';let pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;for(let i=1;i<=Math.min(pdf.numPages,60);i++){let page=await pdf.getPage(i),items=(await page.getTextContent()).items;text+=items.map(x=>x.str).join(' ')+'\n'}}else throw Error('Formato no admitido. Selecciona TXT, DOCX o PDF.');if(!text.trim())throw Error('No se encontró texto seleccionable. Si es un escaneo, copia y pega el contenido.');projectState.file=file.name;projectState.text=text.slice(0,45000);$('#project-text').value=projectState.text;status.textContent=`✓ ${file.name} · ${projectState.text.length.toLocaleString('es-MX')} caracteres extraídos. Revisa el texto antes de generar.`;if(text.length>45000)toast('Se analizarán los primeros 45,000 caracteres')}catch(err){status.textContent='No se pudo leer: '+(err.message||err);toast('Puedes pegar el texto manualmente')}}
function projectSentences(text){return text.replace(/\r/g,'').split(/\n+|(?<=[.!?])\s+(?=[A-ZÁÉÍÓÚÑ])/).map(x=>x.trim().replace(/^[•\-*\d.)\s]+/,'' )).filter(x=>x.length>=18&&x.length<=340)}
function projectSuggestType(t,module){if(module==='inclusion')return 'Evaluación de intervención USAER';if(module==='docente')return 'Observación de la práctica docente';if(module==='institucional')return 'Evaluación de proyecto escolar';if(/producto final|elaborar|creaci[oó]n|presentaci[oó]n|maqueta|cartel|prototipo|exposici[oó]n/i.test(t))return 'Rúbrica analítica';if(/colaboraci[oó]n|convivencia|participaci[oó]n|trabajo en equipo|escucha/i.test(t))return 'Escala estimativa';if(/pasos|procedimiento|materiales|secuencia|entrega/i.test(t))return 'Lista de cotejo';return 'Guía de observación'}
function projectCriteria(text,module){const catalog=[[/colaboraci[oó]n|equipo|corresponsabilidad/i,'Colabora en las tareas y responsabilidades acordadas con su equipo.'],[/escucha|di[aá]logo|comunicaci[oó]n/i,'Escucha y considera las aportaciones de otras personas.'],[/respeto|convivencia|acuerdos/i,'Participa en el establecimiento y cumplimiento de acuerdos de convivencia.'],[/investig|b[uú]squeda de informaci[oó]n|fuentes/i,'Consulta y utiliza información pertinente para desarrollar el proyecto.'],[/lectura|leer|comprensi[oó]n lectora/i,'Identifica y comunica información relevante de los textos trabajados.'],[/escritura|redacci[oó]n|escribir|texto escrito/i,'Organiza y expresa sus ideas de manera comprensible por escrito.'],[/exposici[oó]n|presentaci[oó]n oral|comunicar/i,'Comunica el proceso y los resultados utilizando recursos adecuados.'],[/producto|prototipo|maqueta|cartel|entregable/i,'Elabora un producto que responde a las características acordadas.'],[/problema|soluci[oó]n|resoluci[oó]n/i,'Propone y justifica alternativas para resolver la situación planteada.'],[/creativ|innov|dise[ñn]o/i,'Propone ideas y soluciones originales relacionadas con el propósito.'],[/autonom[ií]a|organizaci[oó]n|planificaci[oó]n/i,'Organiza sus actividades y utiliza los recursos disponibles.'],[/reflexi[oó]n|autoevaluaci[oó]n|mejora/i,'Reconoce avances y propone acciones para mejorar su desempeño.'],[/bap|barreras|participaci[oó]n inclusiva/i,'Identifica prácticas o condiciones del contexto que limitan el aprendizaje o la participación.'],[/ajustes razonables|apoyos|accesibilidad|dua/i,'Documenta la pertinencia de los apoyos y ajustes implementados.'],[/estrategias did[aá]cticas|intervenci[oó]n docente/i,'Registra evidencias de la implementación de las estrategias previstas.']];let result=catalog.filter(([re])=>re.test(text)).map(([,v])=>v);if(module==='inclusion')result.unshift('Describe las barreras contextuales observadas y las oportunidades de participación.');if(module==='docente')result.unshift('Implementa estrategias de enseñanza coherentes con el propósito de aprendizaje.');if(module==='institucional')result.unshift('Da seguimiento a las acciones y compromisos establecidos.');return [...new Set(result)].slice(0,9)}
function analyzeProject(){const text=$('#project-text').value.trim();if(text.length<80){toast('Agrega por lo menos 80 caracteres de tu proyecto');return}projectState.text=text.slice(0,45000);projectState.module=$('#project-mode').value;projectState.format=$('#project-format').value;const candidates=projectSentences(projectState.text);const purpose=candidates.find(x=>/prop[oó]sito|objetivo|finalidad|intenci[oó]n|aprendizaje|pda|proceso de desarrollo/i.test(x))||candidates[0]||'';const products=candidates.filter(x=>/producto|evidencia|resultado|entregable|elaborar|exposici[oó]n/i.test(x)).slice(0,3);const suggested=projectState.format==='auto'?projectSuggestType(text,projectState.module):projectState.format;projectState.findings=projectCriteria(text,projectState.module);if(!projectState.findings.length)projectState.findings=['Realiza las actividades acordadas para el proyecto.','Comunica los aprendizajes o resultados obtenidos.','Utiliza evidencias para revisar su desempeño.'];projectState.purpose=purpose;projectState.suggested=suggested;const output=$('#project-findings');output.innerHTML=`<div class="analysis-results"><h3>Propuesta encontrada</h3><p><b>Formato sugerido:</b> ${esc(suggested)} <small class="muted">(recomendación basada en reglas; revisa su pertinencia)</small></p><div class="field"><label for="review-purpose">Propósito identificado — editable</label><textarea id="review-purpose" rows="3">${esc(purpose)}</textarea></div>${products.length?`<p><b>Posibles productos o evidencias:</b></p><ul>${products.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<h3>Indicadores propuestos</h3><p class="smallmuted">Modifica, borra o incorpora indicadores en el editor posterior. Solo se sugieren indicadores reconocidos por el catálogo de reglas.</p>${projectState.findings.map((c,i)=>`<div class="field"><label>Indicador ${i+1}</label><input data-project-criterion="${i}" value="${esc(c)}"></div>`).join('')}<div class="actions"><button class="btn" onclick="useProject()">✓ Llevar al editor</button><button class="btn secondary" onclick="analyzeProject()">↻ Volver a analizar</button></div></div>`;output.scrollIntoView({behavior:'smooth',block:'start'})}
function useProject(){let criteria=Array.from(document.querySelectorAll('[data-project-criterion]')).map(e=>e.value.trim()).filter(Boolean);if(!criteria.length){toast('Deja por lo menos un indicador');return}let purpose=$('#review-purpose').value.trim();const originalText=projectState.text;state.doc={...structuredClone(starter),id:null,module:projectState.module,type:projectState.suggested,title:'Evaluación de proyecto o planeación',purpose:purpose.slice(0,1200),context:'Instrumento propuesto a partir del texto proporcionado por el docente. Revisar pertinencia según el contexto.',criteria:criteria.slice(0,15),notes:'Propuesta basada en reglas; revisar indicadores respecto al proyecto original.',instructions:'Registra evidencias observables con base en los criterios acordados.'};let titleLine=originalText.match(/(?:nombre del proyecto|t[ií]tulo del proyecto|proyecto)\s*[:：]\s*([^\n.]{4,90})/i);if(titleLine)state.doc.title='Evaluación: '+titleLine[1].trim();state.step=3;navigate('crear');toast('Instrumento listo para revisar y personalizar')}
function render(){setupNav();$('#page-title').textContent=menu.find(x=>x[0]===state.route)?.[2]||'EVACLIC';$('#content').innerHTML=({inicio,biblioteca,crear,proyecto,mis,aplicar,reportes,inclusion,acerca})[state.route]();}render();
</script></body></html>
